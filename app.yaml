kind: wasmer.io/App.v0
name: capstoneproject2026-test
app_id: da_R8EIJtNUa7eQ
owner: kikoy12345amaba
package: .
env:
  PHPIX_PHP_THREADS: '4'
  LNA_DEMO_MODE: 'true'
  DB_CONNECTION: 'mysql'
capabilities:
  database:
    engine: mysql
jobs:
- name: after_deploy
  trigger: post-deployment
  action:
    execute:
      command: after_deploy
annotations:
  anybuild.run/config:
    composer_build_script: post-update-cmd
    composer_enable: true
    name: out
    php_public_dir: public
    phpix: true
    commands:
      after_deploy: php artisan migrate --force --seed
      build: composer run-script post-update-cmd
      install: composer install --optimize-autoloader --ignore-platform-reqs --no-scripts --no-interaction
      start: php -S 0.0.0.0:8080 -t public
    php_framework: laravel
  anybuild.run/provider: php
  anybuild.run/version: 0.33.3
  wasmer.io/version: 7.5.0
enableDatabase: true
enable_email: true
