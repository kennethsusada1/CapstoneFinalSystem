kind: wasmer.io/App.v0
name: capstoneproject2026-test
app_id: da_R8EIJtNUa7eQ
owner: kikoy12345amaba
package: .
env:
  PHPIX_PHP_THREADS: '4'
  LNA_DEMO_MODE: 'true'
  DB_CONNECTION: 'mysql'
capabilities:
  database:
    engine: mysql
jobs:
- name: after_deploy
  trigger: post-deployment
  action:
    execute:
      command: after_deploy
annotations:
  anybuild.run/config:
    composer_build_script: post-update-cmd
    composer_enable: true
    name: out
    node_build_command: pnpm run build
    node_install_inputs:
    - package.json
    - .npmrc
    node_package_manager: pnpm
    php_framework: laravel
    php_public_dir: public
    phpix: true
    commands:
      after_deploy: php artisan migrate --force --seed
  anybuild.run/provider: laravel
  anybuild.run/version: 0.28.2
  wasmer.io/version: 7.4.0
